<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fd79a8" />
      <stop offset="30%" stop-color="#e056fd" />
      <stop offset="65%" stop-color="#686de0" />
      <stop offset="100%" stop-color="#130f40" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7979" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#badc58" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Sunset Sky -->
  <rect width="500" height="500" rx="36" fill="url(#skyGrad)" />
  
  <!-- Crescent Moon -->
  <path d="M 330 65 A 18 18 0 1 0 348 83 A 14 14 0 1 1 330 65 Z" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 0 4px #ffffff)"/>
  
  <!-- Distant Clouds & Stars -->
  <circle cx="120" cy="90" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="210" cy="50" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="270" cy="120" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="390" cy="85" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="80" cy="150" r="1.2" fill="#ffffff" opacity="0.6"/>

  <path d="M 0 300 Q 140 240 280 280 T 500 290 L 500 500 L 0 500 Z" fill="#4834d4" opacity="0.35"/>
  <path d="M 0 340 Q 180 300 360 330 T 500 320 L 500 500 L 0 500 Z" fill="#30336b" opacity="0.5"/>

  <!-- City Skyline Silhouette -->
  <rect x="20" y="340" width="35" height="160" fill="#0c1024" />
  <rect x="25" y="350" width="4" height="6" fill="#f9ca24" opacity="0.8"/>
  <rect x="35" y="370" width="4" height="6" fill="#f9ca24" opacity="0.7"/>
  <rect x="40" y="410" width="4" height="6" fill="#f9ca24" opacity="0.9"/>
  
  <rect x="65" y="320" width="40" height="180" fill="#090d1f" />
  <rect x="75" y="340" width="5" height="8" fill="#f9ca24" opacity="0.85"/>
  <rect x="88" y="360" width="5" height="8" fill="#f9ca24" opacity="0.75"/>
  <polygon points="85,300 85,320 86,320 86,300" stroke="#f9ca24" stroke-width="2"/>
  
  <rect x="115" y="360" width="30" height="140" fill="#0c1024" />
  
  <rect x="360" y="330" width="45" height="170" fill="#090d1f" />
  <rect x="375" y="350" width="5" height="8" fill="#f9ca24" opacity="0.9"/>
  <rect x="390" y="390" width="5" height="8" fill="#f9ca24" opacity="0.6"/>
  
  <rect x="415" y="310" width="50" height="190" fill="#0c1024" />
  <polygon points="440,290 440,310 441,310 441,290" stroke="#f9ca24" stroke-width="2"/>

  <!-- Boy with Headphones Silhouette looking up at the sky -->
  <g transform="translate(140, 160)">
    <!-- Hoodie & Shoulders -->
    <path d="M -10 240 Q 50 180 110 170 Q 140 185 180 210 Q 230 230 250 240 L 250 340 L -10 340 Z" fill="#0d111a"/>
    <!-- Neck -->
    <path d="M 85 160 L 105 135 L 125 155 L 120 185 L 85 185 Z" fill="#1e2433"/>
    <!-- Head Profile looking up right -->
    <path d="M 60 120 C 55 90 75 55 110 50 C 135 48 150 60 155 75 C 160 85 165 92 175 96 C 178 98 178 102 173 105 C 165 110 162 118 160 125 C 158 132 150 140 140 145 C 120 155 90 150 75 140 Z" fill="#141824"/>
    <!-- Messy Anime Hair Spikes -->
    <path d="M 55 105 Q 40 85 50 65 Q 65 40 90 35 Q 115 32 135 42 Q 155 52 165 40 Q 155 60 170 70 Q 150 75 145 85 Q 120 70 95 85 Q 75 95 65 115 Z" fill="#0a0c13"/>
    <!-- Over-ear Headphones -->
    <ellipse cx="108" cy="115" rx="16" ry="24" transform="rotate(-15 108 115)" fill="#2d3436" stroke="#636e72" stroke-width="3"/>
    <path d="M 98 94 C 95 65 115 50 135 52" fill="none" stroke="#2d3436" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
